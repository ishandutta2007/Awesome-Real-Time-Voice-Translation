<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <!-- Abstract Sound Waves -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.4">
    <path d="M100 150 Q 150 50, 200 150 T 300 150 T 400 150 T 500 150 T 600 150 T 700 150 T 800 150 T 900 150 T 1000 150" fill="none" />
    <path d="M100 160 Q 150 80, 200 160 T 300 160 T 400 160 T 500 160 T 600 160 T 700 160 T 800 160 T 900 160 T 1000 160" fill="none" opacity="0.6"/>
    <path d="M100 140 Q 150 120, 200 140 T 300 140 T 400 140 T 500 140 T 600 140 T 700 140 T 800 140 T 900 140 T 1000 140" fill="none" opacity="0.3"/>
  </g>

  <!-- Title Text -->
  <text x="50%" y="45%" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-weight="bold" font-size="52" filter="url(#glow)">Awesome Real-Time</text>
  <text x="50%" y="65%" text-anchor="middle" fill="#38bdf8" font-family="Arial, sans-serif" font-weight="bold" font-size="64" filter="url(#glow)">VOICE TRANSLATION</text>
  
  <!-- Subtitle -->
  <text x="50%" y="82%" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">SaaS Platforms &amp; Open-Source Ecosystem for AI Interpretation</text>
</svg>
